<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Demo Consultant AI Fotovoltaic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,Arial,sans-serif;background:#f3f5f2;color:#333}
header{background:#fff;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #2f9e44;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.logo img{height:72px;display:block}
nav a{text-decoration:none;color:#444;margin-left:25px;font-weight:600}
.hero{height:520px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url('https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1800&q=80') center/cover;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px}
.hero h1{font-size:54px;margin-bottom:20px}
.hero p{font-size:22px;max-width:850px}
.button{display:inline-block;margin-top:30px;background:#2f9e44;color:#fff;padding:16px 34px;border-radius:6px;text-decoration:none;font-weight:bold}
section{max-width:1200px;margin:auto;padding:60px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.card{background:#fff;padding:24px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card h3{color:#2f9e44;margin-bottom:10px}
footer{background:#1f1f1f;color:#fff;text-align:center;padding:25px;margin-top:40px}

/* Stiluri pentru containerul chat și imagine */
.chat-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
}

.chat-wrapper {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    height: 550px;
}

.image-wrapper {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    padding: 20px;
    height: 550px;
    display: flex;
    flex-direction: column;
}

.image-wrapper h3 {
    color: #2f9e44;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #f0f0f0;
}

#image-container {
    flex: 1;
    border: 2px dashed #ddd;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    background: #fafafa;
    min-height: 300px;
}

#image-container.active {
    border-color: #2f9e44;
    background: #f0f8f0;
}

#part-image {
    max-width: 100%;
    max-height: 350px;
    display: none;
    border-radius: 8px;
    object-fit: contain;
}

#image-placeholder {
    color: #999;
    text-align: center;
}

#image-placeholder .icon {
    font-size: 48px;
    display: block;
    margin-bottom: 10px;
}

#image-placeholder .text {
    font-size: 16px;
}

@media (max-width: 768px) {
    .chat-layout {
        grid-template-columns: 1fr;
    }
    .chat-wrapper, .image-wrapper {
        height: 450px;
    }
}
</style>

<!-- SDK-ul Vapi -->
<script src="https://unpkg.com/@vapi-ai/client-sdk-react/dist/sdk.umd.js"></script>
