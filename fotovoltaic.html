<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Vapi SDK</title>
<!-- Încearcă aceste URL-uri pentru SDK -->
<script src="https://cdn.jsdelivr.net/npm/@vapi-ai/client-sdk-react/dist/sdk.umd.js"></script>
<!-- sau alternativ:
<script src="https://unpkg.com/@vapi-ai/web-sdk/dist/vapi.js"></script>
-->
</head>
<body>

<h1>Test Chat Vapi</h1>

<div id="chat" style="width:100%;max-width:600px;height:500px;border:1px solid #ccc;border-radius:10px;overflow:hidden;"></div>

<div id="image-area" style="margin-top:20px;padding:20px;border:2px dashed #ddd;text-align:center;max-width:600px;">
    <img id="part-image" src="" style="max-width:100%;display:none;">
    <p id="placeholder">Așteptând chat-ul...</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Încărcare pagină...');
    console.log('Vapi disponibil?', typeof Vapi);
    console.log('window.Vapi?', window.Vapi);
    
    // Dacă SDK-ul nu s-a încărcat, încearcă să-l încarci dinamic
    if (typeof Vapi === 'undefined') {
        console.log('Încerc să încarc SDK-ul dinamic...');
        
        // Metoda 1: Încearcă cu script tag dinamic
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@vapi-ai/client-sdk-react/dist/sdk.umd.js';
        script.onload = function() {
            console.log('SDK încărcat dinamic!');
            initVapi();
        };
        script.onerror = function() {
            console.error('Nu s-a putut încărca SDK-ul.');
            document.getElementById('chat').innerHTML = 
                '<p style="color:red;padding:20px;">❌ Nu s-a putut încărca SDK-ul Vapi. Verifică conexiunea la internet.</p>' +
                '<p>Încearcă să reîncarci pagina sau să folosești un VPN dacă ești în România (unpkg poate fi blocat).</p>';
        };
        document.head.appendChild(script);
        return;
    }
    
    // Dacă SDK-ul este deja încărcat, inițializează
    initVapi();
});

function initVapi() {
    console.log('✅ Inițializez Vapi...');
    
    const vapi = new Vapi('ab245358-61ea-4876-b767-8e4ad159627d');
    
    const img = document.getElementById('part-image');
    const placeholder = document.getElementById('placeholder');
    
    function showImage() {
        console.log('🖼️ Afișez imaginea demo');
        img.src = 'demo-piesa.jpg';
        img.style.display = 'block';
        placeholder.style.display = 'none';
    }
    
    // Ascultă evenimente
    vapi.on('status-change', function(status) {
        console.log('Status:', status);
        if (status === 'connected' || status === 'ready') {
            showImage();
        }
    });
    
    // Pornește chat-ul
    vapi.start({
        assistantId: '31507d37-ce08-4b23-aa23-bcd25cf1c301'
    });
    
    // Afișează imaginea după 2 secunde (test)
    setTimeout(showImage, 2000);
    
    console.log('✅ Chat pornit!');
}
</script>
</body>
</html>
