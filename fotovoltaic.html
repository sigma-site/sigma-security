<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vapi SDK - Toate variantele</title>
<style>
body{font-family:Arial;padding:20px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:30px;max-width:1200px;margin:20px auto}
.chat-area{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:20px;min-height:500px;border:1px solid #ddd}
.image-area{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:20px;min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed #ddd;transition:all 0.3s}
.image-area.active{border-color:#2f9e44;background:#f0f8f0}
#part-image{max-width:100%;max-height:400px;display:none;border-radius:8px}
#placeholder{color:#999;text-align:center}
#placeholder .icon{font-size:48px;display:block}
#status{padding:10px;margin:10px 0;border-radius:5px;font-weight:bold}
#status.loading{background:#fff3cd;color:#856404}
#status.success{background:#d4edda;color:#155724}
#status.error{background:#f8d7da;color:#721c24}
</style>
</head>
<body>

<h1>⚡ Consultant AI Fotovoltaic</h1>
<div id="status" class="loading">⏳ Încărcare SDK...</div>

<div class="layout">
    <div class="chat-area" id="chat-container">
        <h3>💬 Chat</h3>
        <div id="chat-placeholder" style="color:#999;text-align:center;padding:50px 0;">
            <p>⏳ Se încarcă chat-ul...</p>
        </div>
    </div>
    
    <div class="image-area" id="image-area">
        <h3>📷 Piesa selectată</h3>
        <img id="part-image" src="" alt="Imagine piesă">
        <div id="placeholder">
            <span class="icon">🖼️</span>
            <p>Așteaptă să începi conversația...</p>
        </div>
    </div>
</div>

<!-- Încercăm toate variantele de SDK -->
<script>
// Funcție pentru a încărca un script și a returna o promisiune
function loadScript(url) {
    return new Promise(function(resolve, reject) {
        const script = document.createElement('script');
        script.src = url;
        script.onload = function() { 
            console.log('✅ Încărcat:', url);
            resolve(); 
        };
        script.onerror = function() { 
            console.log('❌ Eșuat:', url);
            reject(new Error('Nu s-a putut încărca: ' + url));
        };
        document.head.appendChild(script);
    });
}

// Lista de URL-uri posibile pentru SDK
const urls = [
    'https://unpkg.com/@vapi-ai/client-sdk-react/dist/sdk.umd.js',
    'https://cdn.jsdelivr.net/npm/@vapi-ai/client-sdk-react/dist/sdk.umd.js',
    'https://unpkg.com/@vapi-ai/web-sdk/dist/vapi.js',
    'https://cdn.jsdelivr.net/npm/@vapi-ai/web-sdk/dist/vapi.js',
    'https://unpkg.com/@vapi-ai/client-sdk-react/dist/index.umd.js',
    'https://cdn.jsdelivr.net/npm/@vapi-ai/client-sdk-react/dist/index.umd.js',
    // Ultima variantă - încarcă direct de la Vapi
    'https://widget.vapi.ai/sdk.js'
];

let sdkLoaded = false;

// Încearcă să încarci SDK-ul
async function tryLoadSDK() {
    const status = document.getElementById('status');
    
    for (let url of urls) {
        try {
            await loadScript(url);
            
            // Verifică dacă Vapi a apărut
            if (typeof Vapi !== 'undefined') {
                console.log('✅ SDK încărcat cu succes de la:', url);
                status.className = 'success';
                status.textContent = '✅ SDK încărcat!';
                sdkLoaded = true;
                initVapi();
                return;
            }
        } catch(e) {
            console.log('Eșuat:', url);
        }
    }
    
    // Dacă niciun URL nu a funcționat
    status.className = 'error';
    status.textContent = '❌ Nu s-a putut încărca SDK-ul Vapi. Verifică conexiunea.';
    document.getElementById('chat-placeholder').innerHTML = 
        '<p style="color:red;">❌ SDK-ul Vapi nu s-a încărcat.</p>' +
        '<p>Încearcă să accesezi manual unul din URL-urile de mai jos:</p>' +
        urls.map(u => '<a href="' + u + '" target="_blank">' + u + '</a><br>').join('');
}

function initVapi() {
    console.log('🚀 Inițializez Vapi...');
    
    const chatContainer = document.getElementById('chat-container');
    const chatPlaceholder = document.getElementById('chat-placeholder');
    const img = document.getElementById('part-image');
    const placeholder = document.getElementById('placeholder');
    const imageArea = document.getElementById('image-area');
    
    function showImage() {
        console.log('🖼️ Afișez imaginea demo');
        img.src = 'demo-piesa.jpg';
        img.style.display = 'block';
        placeholder.style.display = 'none';
        imageArea.classList.add('active');
    }
    
    try {
        const vapi = new Vapi('ab245358-61ea-4876-b767-8e4ad159627d');
        console.log('✅ Vapi instanțiat');
        
        // Ascultă evenimente
        vapi.on('status-change', function(status) {
            console.log('📊 Status:', status);
            if (status === 'connected' || status === 'ready') {
                showImage();
                chatPlaceholder.style.display = 'none';
            }
        });
        
        vapi.on('message', function(message) {
            console.log('💬 Mesaj:', message);
        });
        
        vapi.on('tool-call', function(data) {
            console.log('🔧 Tool call:', data);
            if (data.name === 'displayCarPartImage' && data.parameters?.imageUrl) {
                img.src = data.parameters.imageUrl;
                img.style.display = 'block';
                placeholder.style.display = 'none';
                imageArea.classList.add('active');
            }
        });
        
        // Pornește chat-ul
        vapi.start({
            assistantId: '31507d37-ce08-4b23-aa23-bcd25cf1c301'
        });
        
        console.log('✅ Chat pornit!');
        
        // Test: afișează imaginea după 3 secunde
        setTimeout(showImage, 3000);
        
    } catch(error) {
        console.error('❌ Eroare:', error);
        chatPlaceholder.innerHTML = '<p style="color:red;">Eroare: ' + error.message + '</p>';
    }
}

// Pornește încărcarea
tryLoadSDK();
</script>
</body>
</html>
