<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Simulare Agent - STRICTZILIER.ro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-white p-6 rounded-2xl shadow-lg border border-slate-200 space-y-4">
    <div class="border-b border-slate-100 pb-3">
      <h1 class="text-lg font-black text-slate-900">Simulator Trimitere Link Validare</h1>
      <p class="text-xs text-slate-500 font-medium mt-0.5">Simulează decizia Agentului de a solicita fotografia CI pentru un zilier selectat.</p>
    </div>

    <div>
      <label for="testIdZilier" class="block text-xs font-bold text-slate-700 mb-1">ID Zilier de test</label>
      <input type="text" id="testIdZilier" placeholder="ex: Z100020" value="Z100020" class="w-full h-10 px-3 bg-white border border-slate-300 rounded-lg text-xs font-bold focus:ring-2 focus:ring-amber-500 outline-none uppercase">
    </div>

    <button id="btnTrimiteTest" type="button" onclick="triteSimulare()" class="w-full h-11 bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs rounded-xl transition shadow-sm flex items-center justify-center gap-2">
      TRIMITE LINK PE WHATSAPP DE TEST
    </button>

    <div id="statusTest" class="hidden p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 leading-relaxed"></div>
  </div>

  <script>
    const WEBHOOK_SIMULARE_AGENT = "https://hook.eu1.make.com/SOT_AICI_WEBHOOK_SIMULARE";
    // Numărul fix utilizat strict pentru teste
    const TELEFON_TEST = "07xxxxxxxx"; 

    async function triteSimulare() {
      const idZilier = document.getElementById("testIdZilier").value.trim();
      const statusDiv = document.getElementById("statusTest");
      const btn = document.getElementById("btnTrimiteTest");

      if (!idZilier) {
        alert("Introdu un ID_zilier valid!");
        return;
      }

      btn.disabled = true;
      btn.textContent = "SE TRIMITE...";
      statusDiv.classList.remove("hidden");
      statusDiv.textContent = "Se procesează solicitarea...";

      const payload = {
        ID_zilier: idZilier,
        Telefon_destinatar: TELEFON_TEST,
        Link_validare: `https://strictzilier.ro/date-registru.html?id=${idZilier}`
      };

      try {
        await fetch(WEBHOOK_SIMULARE_AGENT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        statusDiv.innerHTML = `<span class="text-emerald-700 font-bold">✓ Link generat cu succes!</span><br>A fost trimis mesajul WhatsApp către ${TELEFON_TEST} cu link-ul:<br><a href="${payload.Link_validare}" target="_blank" class="text-amber-600 underline font-bold">${payload.Link_validare}</a>`;
      } catch (err) {
        console.error("Eroare simulare:", err);
        statusDiv.innerHTML = `<span class="text-slate-800 font-bold">Link generat pentru test direct:</span><br><a href="${payload.Link_validare}" target="_blank" class="text-amber-600 underline font-bold">${payload.Link_validare}</a>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "TRIMITE LINK PE WHATSAPP DE TEST";
      }
    }
  </script>
</body>
</html>
