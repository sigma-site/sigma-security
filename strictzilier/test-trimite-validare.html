<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Pagină Validare - STRICTZILIER.ro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-white p-6 rounded-2xl shadow-lg border border-slate-200 space-y-4">

    <div class="border-b border-slate-100 pb-3">
      <h1 class="text-lg font-black text-slate-900">Test Pagină Validare Identitate</h1>
      <p class="text-xs text-slate-500 font-medium mt-0.5">
        Deschide direct date-registru.html pentru un ID_zilier dat, pe oricare din cele
        două trasee, fără să mai parcurgi profilul sau scenariul de selecție primară.
      </p>
    </div>

    <div>
      <label for="testIdZilier" class="block text-xs font-bold text-slate-700 mb-1">ID Zilier de test</label>
      <input type="text" id="testIdZilier" placeholder="ex: Z100020" value="Z100020"
             class="w-full h-10 px-3 bg-white border border-slate-300 rounded-lg text-xs font-bold focus:ring-2 focus:ring-amber-500 outline-none uppercase">
    </div>

    <div class="grid grid-cols-1 gap-2">

      <button type="button" onclick="deschide('echipa')"
              class="w-full h-11 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs rounded-xl transition shadow-sm">
        TESTEAZĂ TRASEU ECHIPĂ (sursa=echipa)
      </button>

      <button type="button" onclick="deschide('job')"
              class="w-full h-11 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl transition shadow-sm">
        TESTEAZĂ TRASEU JOB (sursa=job)
      </button>

      <button type="button" onclick="deschide('')"
              class="w-full h-11 bg-slate-500 hover:bg-slate-600 text-white font-extrabold text-xs rounded-xl transition shadow-sm">
        TESTEAZĂ FĂRĂ SURSĂ (implicit)
      </button>

    </div>

    <div id="statusTest" class="hidden p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 leading-relaxed"></div>

  </div>

  <script>
    // Ajustează aici dacă domeniul final diferă.
    const BASE_URL = "https://sigmasecurity.ro/strictzilier/date-registru.html";

    function deschide(sursa) {
      const idZilier = document.getElementById("testIdZilier").value.trim();
      const statusDiv = document.getElementById("statusTest");

      if (!idZilier) {
        alert("Introdu un ID_zilier valid!");
        return;
      }

      let link = `${BASE_URL}?id=${encodeURIComponent(idZilier)}`;
      if (sursa) {
        link += `&sursa=${sursa}`;
      }

      statusDiv.classList.remove("hidden");
      statusDiv.innerHTML =
        `<span class="font-bold text-slate-800">Link deschis:</span><br>` +
        `<a href="${link}" target="_blank" class="text-amber-600 underline font-bold break-all">${link}</a>`;

      window.open(link, "_blank");
    }
  </script>

</body>
</html>
