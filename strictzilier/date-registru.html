<!DOCTYPE1 html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRICTZILIER - Validare Act Identitate</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f8; color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
    h2 { color: #102a43; margin-top: 0; }
    .info-box { background: #e0f2fe; border-left: 4px solid #0284c7; padding: 10px 15px; border-radius: 4px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="file"] { display: block; width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    .alert { padding: 12px 15px; border-radius: 4px; margin-top: 15px; display: none; }
    .alert-success { background-color: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    .alert-danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
  </style>
</head>
<body>

<div class="card">
  <h2>Validare Act Identitate</h2>

  <!-- Date Profil Incarcat -->
  <div class="info-box">
    <p><strong>Zilier:</strong> <span id="lbl-nume">Se încarcă...</span></p>
    <p><strong>CNP înregistrat:</strong> <span id="lbl-cnp">Se încarcă...</span></p>
  </div>

  <!-- Formular Incarcare Foto -->
  <form id="form-foto">
    <div class="form-group">
      <label for="foto_ci">Fotografie Carte de Identitate (CI/BI):</label>
      <input type="file" id="foto_ci" name="foto_ci" accept="image/*" capture="environment" required>
    </div>
    
    <button type="submit" id="btn-trimite">CONFIRMĂ ȘI TRIMITE PENTRU PROCESARE</button>
  </form>

  <!-- Caseta de Notificare (Apare dupa procesare) -->
  <div id="rezultat-validare" class="alert">
    <span id="mesaj-validare"></span>
  </div>
</div>

<script>
  // Webhook-uri Make.com
  const WEBHOOK_INCARCA_PROFIL = "https://hook.eu1.make.com/hxvogpqguw9e65ndnea1xzh33s64ajff";
  const WEBHOOK_VALIDARE_FOTO  = "AICI_PUI_URL_WEBHOOK_NOU_OCR"; // Înlocuiește cu adresa de la modulul 1 (Custom Webhook)

  // Extras ID_zilier din URL
  const urlParams = new URLSearchParams(window.location.search);
  const zilierId = urlParams.get('id');

  // 1. Incărcare date inițiale din Sheets
  if (zilierId) {
    fetch(`${WEBHOOK_INCARCA_PROFIL}?id=${zilierId}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('lbl-nume').innerText = data.nume || 'Necunoscut';
        document.getElementById('lbl-cnp').innerText = data.cnp || 'Neidentificat';
      })
      .catch(() => {
        document.getElementById('lbl-nume').innerText = 'Eroare la încărcare';
        document.getElementById('lbl-cnp').innerText = 'Eroare la încărcare';
      });
  } else {
    alert("Lipsește ID-ul zilierului din URL!");
  }

  // 2. Trimitere Foto și Gestionare Răspuns Status HTTP
  document.getElementById('form-foto').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btn-trimite');
    const alertBox = document.getElementById('rezultat-validare');
    const msgBox = document.getElementById('mesaj-validare');
    const fileInput = document.getElementById('foto_ci');

    if (!fileInput.files[0]) {
      alert("Te rugăm să selectezi o fotografie.");
      return;
    }

    // Blocare buton în timpul procesării
    btn.disabled = true;
    btn.innerText = "Se procesează fotografia...";
    alertBox.style.display = 'none';

    const formData = new FormData();
    formData.append('ID_zilier', zilierId);
    formData.append('foto_ci', fileInput.files[0]);

    fetch(WEBHOOK_VALIDARE_FOTO, {
      method: 'POST',
      body: formData
    })
    .then(async (response) => {
      let data = {};
      try {
        data = await response.json();
      } catch (err) {
        data = { message: "Răspuns primit de la server." };
      }

      alertBox.style.display = 'block';

      if (response.ok && data.success) {
        // Cazul HTTP 200 (Ramura A - Match CNP)
        alertBox.className = 'alert alert-success';
        msgBox.innerText = "✓ " + (data.message || "Fotografia a fost procesată, iar datele s-au potrivit cu profilul tău.");
        btn.innerText = "VALIDARE COMPLETATĂ";
      } else {
        // Cazul HTTP 400 / Fallback (Ramura B - Mismatch / Neclar)
        alertBox.className = 'alert alert-danger';
        msgBox.innerText = "✕ " + (data.message || "CNP-ul din imagine nu se potrivește cu datele din dosar sau poza este neclară.");
        btn.disabled = false;
        btn.innerText = "REÎNCEARCĂ TRIMITEREA";
      }
    })
    .catch((error) => {
      console.error('Eroare rețea:', error);
      alertBox.style.display = 'block';
      alertBox.className = 'alert alert-danger';
      msgBox.innerText = "✕ A apărut o eroare de conexiune. Verifică rețeaua și încearcă din nou.";
      btn.disabled = false;
      btn.innerText = "CONFIRMĂ ȘI TRIMITE PENTRU PROCESARE";
    });
  });
</script>

</body>
</html>
