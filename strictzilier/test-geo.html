<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Test Geocodare Make</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8 flex items-center justify-center min-h-screen">
  <div class="bg-white p-6 rounded-2xl shadow-md max-w-md w-full space-y-4">
    <h1 class="text-lg font-bold text-slate-800">Test Schimbare Zonă & Coordonate</h1>
    <p class="text-xs text-slate-500">Introdu o localitate din România pentru a testa preluarea automată a coordonatelor prin Make.</p>
    
    <div>
      <label class="block text-xs font-bold text-slate-600 mb-1">Județ</label>
      <input type="text" id="test-judet" value="Bacau" class="w-full px-3 py-2 border rounded-lg text-sm">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-600 mb-1">Oraș / Comună (Zona Preferată)</label>
      <input type="text" id="test-zona" value="Sascut" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="ex: Targu Ocna">
    </div>

    <button onclick="trimiteTestGeo()" class="w-full py-2.5 bg-blue-600 text-white font-bold text-xs rounded-lg hover:bg-blue-700 transition">
      Testează Salvarea și Coordonate
    </button>

    <div id="test-status" class="text-xs font-semibold text-center mt-2"></div>
  </div>

  <script>
    const WEBHOOK_TEST_GEO = "https://hook.eu1.make.com/dhmvtb23hz4ru8u9ggpmktevxshdxxu1";

    async function trimiteTestGeo() {
      const judet = document.getElementById("test-judet").value.trim();
      const zona = document.getElementById("test-zona").value.trim();
      const statusDiv = document.getElementById("test-status");

      if (!judet || !zona) {
        alert("Completează ambele câmpuri!");
        return;
      }

      statusDiv.textContent = "Se trimite spre Make...";
      statusDiv.className = "text-xs font-semibold text-center mt-2 text-blue-600";

      try {
        const response = await fetch(WEBHOOK_TEST_GEO, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ID_zilier: "TEST_999",
            Judet: judet,
            ZonaPreferata: zona
          })
        });

        if (response.ok) {
          statusDiv.textContent = "Succes! Coordonatele au fost cerute și salvate.";
          statusDiv.className = "text-xs font-semibold text-center mt-2 text-emerald-600";
        } else {
          throw new Error("Eroare de server");
        }
      } catch (err) {
        statusDiv.textContent = "Eroare la trimitere: " + err.message;
        statusDiv.className = "text-xs font-semibold text-center mt-2 text-rose-600";
      }
    }
  </script>
</body>
</html>
