<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Verificare CUI Angajator</title>
<style>
body{ font-family:Arial,sans-serif; max-width:500px; margin:40px auto; padding:20px; }
h2{ text-align:center; }
input, button{ width:100%; padding:12px; margin-bottom:15px; box-sizing:border-box; font-size:16px; }
button{ cursor:pointer; background:#1e3a8a; color:white; border:none; border-radius:4px; font-weight:bold; }
button:hover{ background:#1d4ed8; }
#rezultat{ margin-top:20px; padding:15px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:4px; white-space: pre-wrap; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>

<h2>Test CUI & Date Angajator</h2>

<form id="formularCUI">
    <input type="text" id="cui" placeholder="Introdu CUI (ex: 12345678 sau RO12345678)" required>
    <button type="submit">Verifică CUI / Trimite</button>
</form>

<div id="rezultat">Aștept interogarea...</div>

<script>
// Aici vei pune adresa noului Webhook din Make.com dedicat testului
const webhookTest = "LIPEȘTE_WEBHOOK_UL_TĂU_DE_TEST_AICI";

document.getElementById("formularCUI").addEventListener("submit", async (e) => {
    e.preventDefault();
    const cuiVal = document.getElementById("cui").value.trim();
    
    document.getElementById("rezultat").innerHTML = "Se interoghează...";

    try {
        const response = await fetch(webhookTest, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cui: cuiVal })
        });

        const data = await response.json();
        document.getElementById("rezultat").innerHTML = "Răspuns primit:\n" + JSON.stringify(data, null, 2);
    } catch (err) {
        document.getElementById("rezultat").innerHTML = "Eroare de comunicare cu webhook-ul.";
    }
});
</script>

</body>
</html>
