<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Verificare CUI Angajator</title>
<style>
body{ font-family:Arial,sans-serif; max-width:500px; margin:40px auto; padding:20px; }
h2{ text-align:center; }
input, button{ width:100%; padding:12px; margin-bottom:15px; box-sizing:border-box; font-size:16px; }
button{ cursor:pointer; background:#1e3a8a; color:white; border:none; border-radius:4px; font-weight:bold; }
button:hover{ background:#1d4ed8; }
#rezultat{ margin-top:20px; padding:15px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:4px; white-space: pre-wrap; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>

<h2>Test CUI & Date Angajator</h2>

<form id="formularCUI">
    <input type="text" id="cui" placeholder="Introdu CUI (ex: 12345678)" required>
    <button type="submit">Verifică CUI / Trimite</button>
</form>

<div id="rezultat">Aștept interogarea...</div>

<script>
// Pune aici link-ul tău exact din Make.com (Custom Webhook)
const webhookTest = "https://hook.eu1.make.com/EXEMPLU_URL_AICI";

document.getElementById("formularCUI").addEventListener("submit", async (e) => {
    e.preventDefault();
    const cuiVal = document.getElementById("cui").value.trim();
    
    const divRezultat = document.getElementById("rezultat");
    divRezultat.innerHTML = "Se trimite spre Make...";

    try {
        const response = await fetch(webhookTest, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json" 
            },
            body: JSON.stringify({ cui: cuiVal })
        });

        if (!response.ok) {
            throw new Error(`Eroare HTTP! Status: ${response.status}`);
        }

        const data = await response.text(); // Folosim text ca să vedem orice răspuns întors de Make
        divRezultat.innerHTML = "Răspuns primit cu succes de la Make:\n" + data;
    } catch (err) {
        divRezultat.innerHTML = "Eroare de comunicare:\n" + err.message;
        console.error(err);
    }
});
</script>

</body>
</html>
