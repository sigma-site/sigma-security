<style>

body{

header{

.main{

}

.content{

.subtitle{

}

.section{

}

.section h2{

}

.info-grid{

}

.info{

    border:1px solid #e4e7e9;

    padding:10px 11px;
}

.info label{

    color:#737d83;
    margin-bottom:5px;
}

.info strong{
    display:block;
    font-size:13px;
    font-weight:600;
    word-break:break-word;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.buttons button{
    flex:1;

    border:none;

    border-radius:7px;

    padding:11px 14px;

    cursor:pointer;

    font-size:13px;

    font-weight:bold;
}

.primary{

    color:#fff;
}

.secondary{
    background:#263238;
    color:#fff;
}


/* =====================================================

<!-- =====================================================
     ÎNCĂRCARE AGENT.HTML
     ===================================================== -->

<script>

async function loadStrictzilierAgent(){

    const container =
        document.getElementById(
            "agent-container"
        );


    try{

        const response =
            await fetch(
                "agent.html"
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status +
                " - agent.html nu poate fi încărcat."
            );

        }


        const html =
            await response.text();


        const temporary =
            document.createElement(
                "div"
            );


        temporary.innerHTML =
            html;


        const scripts =
            temporary.querySelectorAll(
                "script"
            );


        scripts.forEach(
            script => {

                script.remove();

            }
        );


        while(
            temporary.firstChild
        ){

            container.appendChild(
                temporary.firstChild
            );

        }


        for(
            const oldScript of scripts
        ){

            const newScript =
                document.createElement(
                    "script"
                );


            for(
                const attribute
                of oldScript.attributes
            ){

                newScript.setAttribute(
                    attribute.name,
                    attribute.value
                );

            }


            if(
                oldScript.src
            ){

                newScript.src =
                    oldScript.src;

            }
            else{

                newScript.textContent =
                    oldScript.textContent;

            }


            document.body.appendChild(
                newScript
            );

        }

    }

    catch(error){

        console.error(
            "STRICTZILIER AGENT:",
            error
        );


        container.innerHTML =

            "<div style=\"" +
            "height:560px;" +
            "display:flex;" +
            "align-items:center;" +
            "justify-content:center;" +
            "background:#173b3a;" +
            "color:white;" +
            "border-radius:12px;" +
            "font-family:Arial,sans-serif;" +
            "font-size:13px;" +
            "text-align:center;" +
            "padding:20px;" +
            "\">" +

            "Asistentul nu a putut fi încărcat.<br>" +

            error.message +

            "</div>";

    }

}


loadStrictzilierAgent();

</script>
