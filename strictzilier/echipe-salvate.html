<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arhivă Echipe - STRICTZILIER.ro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-xl sm:text-2xl font-black tracking-tight text-blue-700">STRICT<span class="text-amber-500">ZILIER</span>.ro</span>
      </a>
      <a href="formare-echipa.html" class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition shadow-sm">
        ← Înapoi la formular
      </a>
    </div>
  </header>

  <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
      
      <div class="mb-6">
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Echipele mele salvate</h1>
        <p class="text-xs font-semibold text-amber-600 mt-1.5 bg-amber-50 inline-block px-3 py-1.5 rounded-md border border-amber-200">
          👉 Selectați o linie din listă pentru a încărca și edita echipa dorită.
        </p>
      </div>

      <div class="overflow-x-auto rounded-xl border border-slate-200">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
              <th class="p-3.5">Denumire Echipă</th>
              <th class="p-3.5">Activitate</th>
              <th class="p-3.5">Zonă Preferată</th>
              <th class="p-3.5 text-right">Data Constituire</th>
            </tr>
          </thead>
          <tbody id="teamsTableBody" class="divide-y divide-slate-100 font-medium">
            <tr>
              <td colspan="4" class="p-4 text-center text-slate-400">Se încarcă echipele...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script>
    // URL-ul Webhook-ului de citire din Make.com
    const URL_PRELUARE_ECHIPE = "https://hook.eu1.make.com/SOT_AICI_WEBHOOK_TAU";

    document.addEventListener("DOMContentLoaded", () => {
      fetchTeams();
    });

    async function fetchTeams() {
      const tbody = document.getElementById("teamsTableBody");
      
      try {
        // Trimitem param ID_initiator spre Webhook pentru filtrare
        const response = await fetch(`${URL_PRELUARE_ECHIPE}?ID_initiator=Z100001`);
        
        if (!response.ok) {
          throw new Error(`Eroare HTTP! Status: ${response.status}`);
        }

        const data = await response.json();
        console.log("Date primite din Make:", data);

        renderTeamsTable(data);
      } catch (error) {
        console.error("Eroare la aducerea datelor:", error);
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500 font-bold">A apărut o eroare la conexiunea cu serverul. Verificați consola.</td></tr>`;
      }
    }

    function renderTeamsTable(teams) {
      const tbody = document.getElementById("teamsTableBody");
      tbody.innerHTML = "";

      if (!Array.isArray(teams) || teams.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Nu s-a găsit nicio echipă salvată.</td></tr>`;
        return;
      }

      teams.forEach(team => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-amber-50/60 cursor-pointer transition select-none border-b border-slate-100";
        
        tr.innerHTML = `
          <td class="p-3.5 font-bold text-slate-900">${team.Nume_echipa || '-'}</td>
          <td class="p-3.5 text-slate-600">${team.Activitate_preferata || '-'}</td>
          <td class="p-3.5 text-slate-600">${team.Zona_preferata || '-'}</td>
          <td class="p-3.5 text-right text-slate-500 font-semibold">${team.Data_constituire || '-'}</td>
        `;

        tr.addEventListener("click", () => {
          const selectedTeam = {
            ID_echipa: team.ID_echipa,
            Nume_echipa: team.Nume_echipa,
            Activitate_preferata: team.Activitate_preferata,
            Membri: team.Membri || []
          };
          localStorage.setItem("selected_team_edit", JSON.stringify(selectedTeam));
          window.location.href = "formare-echipa.html";
        });

        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
