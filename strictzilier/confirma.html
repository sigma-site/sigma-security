<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmare Echipă - Strict Zilier</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6 text-slate-800">
    <h1 class="text-2xl font-bold text-center mb-6 text-slate-900">Confirmare Participare Echipă</h1>

    <!-- Detalii Echipă -->
    <div id="detailsContainer" class="space-y-3 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
      <div class="flex justify-between">
        <span class="font-semibold text-slate-600">Nume Echipă:</span>
        <span id="valNumeEchipa" class="text-slate-900 font-medium">-</span>
      </div>
      <div class="flex justify-between">
        <span class="font-semibold text-slate-600">Activitate:</span>
        <span id="valActivitate" class="text-slate-900">-</span>
      </div>
      <div class="flex justify-between">
        <span class="font-semibold text-slate-600">Zonă:</span>
        <span id="valZona" class="text-slate-900">-</span>
      </div>
      <div class="flex justify-between">
        <span class="font-semibold text-slate-600">Constituită la:</span>
        <span id="valData" class="text-slate-900">-</span>
      </div>
    </div>

    <!-- Butoanele de acțiune (DA și NU) -->
    <div id="buttonsContainer" class="flex gap-4">
      <button onclick="trimiteRaspuns('DA')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
        DA, confirm
      </button>
      <button onclick="trimiteRaspuns('NU')" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
        NU, refuz
      </button>
    </div>

    <!-- Zona de Feedback / Mesaj de succes sau blocare -->
    <div id="feedbackBox" class="hidden text-center py-6">
      <div id="feedbackIcon" class="text-5xl mb-3">✅</div>
      <h2 id="feedbackTitle" class="text-xl font-bold text-slate-900 mb-2">Invitație Confirmată!</h2>
      <p id="feedbackText" class="text-slate-600 text-sm">Răspunsul tău a fost înregistrat cu succes în sistem. Mulțumim!</p>
    </div>
  </div>

  <script>
    // URL-ul webhook-ului de salvare din Make.com
    const WEBHOOK_RASPUNS_INVITATIE = "https://hook.eu1.make.com/wjy6flfjohhyff61h7iymxc4bl9p64h6";

    // Preluarea parametrilor din URL (ex: ?echipa=E160&tel=0712345678)
    const urlParams = new URLSearchParams(window.location.search);
    const idEchipa = urlParams.get('echipa');
    const telefonMembru = urlParams.get('tel');

    // Funcția care aduce datele echipei și starea curentă la încărcarea paginii
    async function incarcaDetaliiEchipa() {
      if (!idEchipa || !telefonMembru) {
        document.getElementById("detailsContainer").innerHTML = '<p class="text-red-500 text-center font-medium">Link incomplet sau invalid.</p>';
        document.getElementById("buttonsContainer").classList.add("hidden");
        return;
      }

      try {
        const response = await fetch(`https://hook.eu1.make.com/6mnwsn8hbp3q11a3ii7i7dum46qlntte?echipa=${idEchipa}&tel=${telefonMembru}`);
        const data = await response.json();

        const echipa = Array.isArray(data) ? data[0] : data;

        if (echipa) {
          document.getElementById("valNumeEchipa").textContent = echipa.Nume_echipa || "-";
          document.getElementById("valActivitate").textContent = echipa.Activitate_preferata || "-";
          document.getElementById("valZona").textContent = echipa.Zona_preferata || "-";
          document.getElementById("valData").textContent = echipa.Data_constituire ? echipa.Data_constituire.split("T")[0] : "-";

          // VERIFICARE CRUCIALĂ LA ÎNCĂRCARE: Dacă s-a răspuns deja, blocăm din prima secundă!
          if (echipa.Raspuns_confirmare && echipa.Raspuns_confirmare.trim() !== "") {
            document.getElementById("buttonsContainer").classList.add("hidden");
            const feedbackBox = document.getElementById("feedbackBox");
            feedbackBox.classList.remove("hidden");
            document.getElementById("feedbackIcon").textContent = "✅";
            document.getElementById("feedbackTitle").textContent = "Invitație Deja Procesată!";
            document.getElementById("feedbackText").textContent = "Ai răspuns deja la această invitație anterior. Îți mulțumim!";
          }
        } else {
          document.getElementById("detailsContainer").innerHTML = '<p class="text-red-500 text-center font-medium">Echipa sau membrul nu au fost găsiți.</p>';
          document.getElementById("buttonsContainer").classList.add("hidden");
        }
      } catch (err) {
        console.error("Eroare la preluarea datelor:", err);
        document.getElementById("detailsContainer").innerHTML = '<p class="text-red-500 text-center font-medium">Eroare de conexiune cu serverul.</p>';
        document.getElementById("buttonsContainer").classList.add("hidden");
      }
    }

    // Funcția care trimite răspunsul ("DA" sau "NU") spre Make.com
    async function trimiteRaspuns(optiune) {
      const buttonsContainer = document.getElementById("buttonsContainer");
      const feedbackBox = document.getElementById("feedbackBox");
      const feedbackIcon = document.getElementById("feedbackIcon");
      const feedbackTitle = document.getElementById("feedbackTitle");
      const feedbackText = document.getElementById("feedbackText");

      buttonsContainer.classList.add("hidden");
      feedbackBox.classList.remove("hidden");
      feedbackIcon.textContent = "⏳";
      feedbackTitle.textContent = "Se trimite răspunsul...";
      feedbackText.textContent = "Te rugăm o secundă.";

      const payload = {
        ID_echipa: idEchipa,
        tel: telefonMembru,
        Raspuns: optiune
      };

      try {
        await fetch(WEBHOOK_RASPUNS_INVITATIE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (optiune === 'DA') {
          feedbackIcon.textContent = "✅";
          feedbackTitle.textContent = "Invitație Acceptată!";
          feedbackText.textContent = "Răspunsul tău a fost înregistrat cu succes în sistem. Mulțumim!";
        } else {
          feedbackIcon.textContent = "❌";
          feedbackTitle.textContent = "Invitație Refuzată";
          feedbackText.textContent = "Am înregistrat răspunsul tău. Îți mulțumim pentru informare!";
        }

      } catch (err) {
        console.error("Eroare:", err);
        feedbackIcon.textContent = "⚠️";
        feedbackTitle.textContent = "Eroare de comunicare";
        feedbackText.textContent = "A apărut o problemă la salvarea datelor.";
      }
    }

    incarcaDetaliiEchipa();
  </script>
</body>
</html>
