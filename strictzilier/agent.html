<!DOCTYPE html>
<html lang="ro">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
}


/* =====================================================
   CONTAINER AGENT
   ===================================================== */

.strictzilier-agent{

    width:100%;
    height:560px;

    display:flex;
    flex-direction:column;
    align-items:center;

    background:#173b3a;
    color:white;

    padding:18px;

    border-radius:12px;

    text-align:center;

    box-shadow:
        0 16px 40px rgba(23,59,58,.20);

    font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
   BADGE
   ===================================================== */

.strictzilier-agent .badge{

    width:fit-content;

    padding:7px 12px;

    border-radius:30px;

    background:rgba(255,255,255,.10);

    color:#cce8df;

    font-size:12px;

    font-weight:700;

    letter-spacing:.7px;
}


/* =====================================================
   DESCRIERE
   ===================================================== */

.agent-description{

    width:100%;
    max-width:370px;

    margin:12px 0 12px;

    color:#c5d4d1;

    line-height:1.4;

    font-size:13px;
}


/* =====================================================
   CONVERSAȚIE
   ===================================================== */

.conversation{

    width:100%;

    flex:1;

    min-height:0;

    padding:12px;

    margin-bottom:12px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.12);

    border-radius:12px;

    overflow-y:auto;

    text-align:left;
}


/* =====================================================
   MESAJE
   ===================================================== */

.message{

    max-width:86%;

    margin-bottom:9px;

    padding:9px 11px;

    border-radius:9px;

    font-size:12px;

    line-height:1.4;
}


.message.agent-message{

    background:rgba(255,255,255,.10);

    color:#edf5f3;

    margin-right:auto;
}


.message.user-message{

    background:#d9873d;

    color:white;

    margin-left:auto;
}


.message-label{

    display:block;

    margin-bottom:3px;

    font-size:9px;

    font-weight:800;

    opacity:.65;
}


/* =====================================================
   VOCAL / SCRIS
   ===================================================== */

.mode-switch{

    width:100%;

    max-width:330px;

    display:grid;

    grid-template-columns:1fr 34px 1fr;

    gap:6px;

    margin-bottom:9px;

    flex-shrink:0;
}


.mode-btn{

    height:34px;

    border:1px solid rgba(255,255,255,.18);

    border-radius:8px;

    background:rgba(255,255,255,.07);

    color:#cce8df;

    font-size:11px;

    font-weight:800;

    cursor:pointer;
}


.mode-btn.active{

    background:#d9873d;

    border-color:#d9873d;

    color:white;
}


/* =====================================================
   BULINA
   ===================================================== */

.agent-orb{

    width:34px;

    height:34px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        0 0 0 4px rgba(255,255,255,.025);

    color:white;

    font-size:15px;

    transition:.25s ease;
}


.strictzilier-agent.active .agent-orb{

    background:rgba(47,125,104,.55);

    border-color:#cce8df;

    box-shadow:
        0 0 0 4px rgba(47,125,104,.12),
        0 0 14px rgba(47,125,104,.45);
}


/* =====================================================
   PANOURI
   ===================================================== */

.mode-panel{

    width:100%;

    max-width:330px;

    flex-shrink:0;
}


.mode-panel.hidden{

    display:none;
}


/* =====================================================
   BUTON PORNIRE VOCAL
   ===================================================== */

.agent-btn{

    width:100%;

    max-width:330px;

    height:48px;

    flex-shrink:0;

    border:none;

    border-radius:10px;

    background:white;

    color:#173b3a;

    font-size:13px;

    font-weight:800;

    cursor:pointer;
}


.strictzilier-agent.active .agent-btn{

    background:#d9873d;

    color:white;
}


/* =====================================================
   STATUS VOCAL
   ===================================================== */

.status{

    min-height:16px;

    margin-top:7px;

    color:#cce8df;

    font-size:11px;

    font-weight:700;
}


/* =====================================================
   CHAT SCRIS
   ===================================================== */

.chat-input{

    display:flex;

    gap:7px;

    width:100%;
}


.chat-input input{

    flex:1;

    min-width:0;

    height:48px;

    padding:0 12px;

    border:none;

    border-radius:9px;

    outline:none;

    font-size:13px;
}


.chat-input button{

    width:82px;

    height:48px;

    border:none;

    border-radius:9px;

    background:#d9873d;

    color:white;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    flex-shrink:0;
}


.chat-input button:disabled{

    opacity:.6;

    cursor:default;
}


.chat-status{

    min-height:16px;

    margin-top:6px;

    color:#cce8df;

    font-size:10px;

    font-weight:700;
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media(max-width:520px){

    .strictzilier-agent{

        height:560px;

        padding:20px 16px;

    }

    .agent-description{

        font-size:12px;

    }

}

</style>

</head>


<body>


<div
    id="strictzilierAgent"
    class="strictzilier-agent">


    <div class="badge">

        AGENT STRICTZILIER

    </div>


    <p class="agent-description">

        Spune ce cauți sau de ce ai nevoie. Agentul mediază
        întâlnirea dintre zilieri și angajatori.

    </p>


    <div
        id="conversation"
        class="conversation">


        <div
            class="message agent-message">


            <span class="message-label">

                AGENT

            </span>


            Bun venit. Alege modul vocal sau scris
            pentru a începe conversația.


        </div>


    </div>


    <div class="mode-switch">


        <button
            id="voiceModeButton"
            class="mode-btn active"
            type="button">

            VOCAL

        </button>


        <div
            class="agent-orb"
            aria-hidden="true">

            ✦

        </div>


        <button
            id="textModeButton"
            class="mode-btn"
            type="button">

            SCRIS

        </button>


    </div>


    <div
        id="voicePanel"
        class="mode-panel">


        <button
            id="agentButton"
            class="agent-btn"
            type="button">

            PORNEȘTE CONVERSAȚIA

        </button>


        <div
            id="status"
            class="status">

        </div>


    </div>


    <div
        id="textPanel"
        class="mode-panel hidden">


        <div class="chat-input">


            <input
                id="messageInput"
                type="text"
                placeholder="Scrieți mesajul..."
                autocomplete="off">


            <button
                id="sendButton"
                type="button">

                TRIMITE

            </button>


        </div>


        <div
            id="chatStatus"
            class="chat-status">

        </div>


    </div>


</div>


<script type="module">

import Vapi
    from "https://esm.sh/@vapi-ai/web";


const PUBLIC_KEY =
    "ab245358-61ea-4876-b767-8e4ad159627d";


const ASSISTANT_ID =
    "970da2f1-89c8-438c-ac8c-30abfa04528e";


const CHAT_URL =
    "https://2.pie.host/chat.php";


const vapi =
    new Vapi(PUBLIC_KEY);


const agent =
    document.getElementById(
        "strictzilierAgent"
    );


const voiceModeButton =
    document.getElementById(
        "voiceModeButton"
    );


const textModeButton =
    document.getElementById(
        "textModeButton"
    );


const voicePanel =
    document.getElementById(
        "voicePanel"
    );


const textPanel =
    document.getElementById(
        "textPanel"
    );


const button =
    document.getElementById(
        "agentButton"
    );


const status =
    document.getElementById(
        "status"
    );


const conversation =
    document.getElementById(
        "conversation"
    );


const input =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const chatStatus =
    document.getElementById(
        "chatStatus"
    );


let conversationActive =
    false;


let previousChatId =
    null;


let currentMode =
    "voice";


/* =====================================================
   MESAJ
   ===================================================== */

function addMessage(
    type,
    text
){

    if(
        !text ||
        !text.trim()
    ){

        return;

    }


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        (
            type === "user"
                ? "user-message"
                : "agent-message"
        );


    const label =
        document.createElement(
            "span"
        );


    label.className =
        "message-label";


    label.textContent =
        type === "user"
            ? "TU"
            : "AGENT";


    const content =
        document.createElement(
            "div"
        );


    content.textContent =
        text;


    message.appendChild(
        label
    );


    message.appendChild(
        content
    );


    conversation.appendChild(
        message
    );


    conversation.scrollTop =
        conversation.scrollHeight;

}


/* =====================================================
   SCHIMBARE MOD
   ===================================================== */

function setMode(
    mode
){

    if(
        mode === currentMode
    ){

        return;

    }


    if(
        mode === "text" &&
        conversationActive
    ){

        vapi.stop();


        conversationActive =
            false;


        agent.classList.remove(
            "active"
        );


        button.textContent =
            "PORNEȘTE CONVERSAȚIA";


        status.textContent =
            "";

    }


    currentMode =
        mode;


    const voice =
        mode === "voice";


    voiceModeButton.classList.toggle(
        "active",
        voice
    );


    textModeButton.classList.toggle(
        "active",
        !voice
    );


    voicePanel.classList.toggle(
        "hidden",
        !voice
    );


    textPanel.classList.toggle(
        "hidden",
        voice
    );


    if(
        !voice
    ){

        input.focus();

    }

}


voiceModeButton.addEventListener(
    "click",
    function(){

        setMode(
            "voice"
        );

    }
);


textModeButton.addEventListener(
    "click",
    function(){

        setMode(
            "text"
        );

    }
);


/* =====================================================
   EVENIMENTE VAPI
   ===================================================== */

vapi.on(
    "message",
    function(message){

        console.log(
            "VAPI MESSAGE:",
            message
        );


        if(
            message.type ===
            "transcript"
        ){

            const role =
                message.role;


            const text =
                message.transcript;


            if(
                message.transcriptType ===
                "final"
            ){

                addMessage(
                    role === "user"
                        ? "user"
                        : "agent",
                    text
                );

            }

        }

    }
);


/* =====================================================
   PORNIRE VOCE
   ===================================================== */

button.addEventListener(
    "click",
    async function(){

        if(
            conversationActive
        ){

            vapi.stop();


            conversationActive =
                false;


            agent.classList.remove(
                "active"
            );


            button.textContent =
                "PORNEȘTE CONVERSAȚIA";


            status.textContent =
                "";


            return;

        }


        status.textContent =
            "Se conectează...";


        try{

            await vapi.start(
                ASSISTANT_ID
            );


            conversationActive =
                true;


            agent.classList.add(
                "active"
            );


            button.textContent =
                "ÎNCHIDE CONVERSAȚIA";


            status.textContent =
                "Conversația vocală este activă.";

        }

        catch(error){

            console.error(
                "Eroare Vapi:",
                error
            );


            status.textContent =
                "Nu s-a putut porni conversația.";

        }

    }
);


/* =====================================================
   EROARE VAPI
   ===================================================== */

vapi.on(
    "error",
    function(error){

        console.error(
            "Vapi error:",
            error
        );


        status.textContent =
            "Eroare Vapi.";

    }
);


/* =====================================================
   CHAT SCRIS
   ===================================================== */

async function sendTextMessage(){

    const message =
        input.value.trim();


    if(
        !message
    ){

        return;

    }


    addMessage(
        "user",
        message
    );


    input.value =
        "";


    sendButton.disabled =
        true;


    chatStatus.textContent =
        "Se contactează agentul...";


    try{

        const response =
            await fetch(
                CHAT_URL,
                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            previousChatId:
                                previousChatId

                        })

                }
            );


        const data =
            await response.json();


        console.log(
            "Răspuns chat:",
            data
        );


        if(
            !response.ok
        ){

            addMessage(
                "agent",
                "EROARE:\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                )
            );


            return;

        }


        if(
            data.chatId
        ){

            previousChatId =
                data.chatId;

        }


        addMessage(
            "agent",
            data.reply ||
            "Agentul nu a returnat un răspuns."
        );


        chatStatus.textContent =
            "";

    }

    catch(error){

        console.error(
            error
        );


        addMessage(
            "agent",
            "Eroare de conectare:\n" +
            error.message
        );

    }

    finally{

        sendButton.disabled =
            false;


        input.focus();

    }

}


sendButton.addEventListener(
    "click",
    sendTextMessage
);


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendTextMessage();

        }

    }
);

</script>


</body>
</html>
