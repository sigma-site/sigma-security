<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formare Echipă - STRICTZILIER.ro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-xl sm:text-2xl font-black tracking-tight text-blue-700">STRICT<span class="text-amber-500">ZILIER</span>.ro</span>
      </a>
      <div class="flex items-center gap-2">
        <a href="echipe-salvate.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition">
          Arhivă Echipe
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
      
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <div>
          <h1 id="pageTitle" class="text-2xl font-black text-slate-900">Formare Echipă Nouă</h1>
          <p class="text-xs text-slate-500 mt-1">Adăugați membrii și trimiteți invitațiile pe WhatsApp.</p>
        </div>
        <button type="button" onclick="resetFormToNew()" class="px-4 py-2 bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200 font-bold text-xs rounded-lg transition">
          + Formează o nouă echipă
        </button>
      </div>

      <form id="formEchipa" onsubmit="handleFormSubmit(event)" class="space-y-6">
        
        <!-- CÂMP ASCUNS PENTRU RETINEREA ID_ECHIPA LA EDITARE -->
        <input type="hidden" id="ID_echipa" name="ID_echipa" value="">

        <!-- Date generale echipă -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Nume echipă *</label>
            <input type="text" id="Nume_echipa" required placeholder="Ex: Echipa Zidari Bacău" class="w-full h-10 px-3 border border-slate-300 rounded-lg text-xs font-medium focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Activitate preferată *</label>
            <input type="text" id="Activitate_preferata" required placeholder="Ex: Construcții" class="w-full h-10 px-3 border border-slate-300 rounded-lg text-xs font-medium focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
        </div>

        <!-- Tabel Membri -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-bold text-slate-700">Membri propuși în echipă</label>
            <button type="button" onclick="addMemberRow()" class="text-xs font-bold text-blue-600 hover:text-blue-800">
              + Adaugă rând
            </button>
          </div>

          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                <tr>
                  <th class="p-3">Nume și Prenume</th>
                  <th class="p-3">Număr Telefon</th>
                  <th class="p-3 text-center w-16">Acțiune</th>
                </tr>
              </thead>
              <tbody id="membersTableBody" class="divide-y divide-slate-100">
                <!-- Se populează dinamic -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-4 border-t border-slate-100 flex justify-end">
          <button type="submit" id="btnSubmit" class="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow-md transition">
            Trimite Invitații WhatsApp
          </button>
        </div>

      </form>
    </div>
  </main>

  <script>
    const WEBHOOK_MAKE = "https://hook.eu1.make.com/https://hook.eu1.make.com/p43fhc1oejmwm5yecgfmf3cu31g9t7h9";

    // Structura dinamică a membrilor
    let membersList = [];

    document.addEventListener("DOMContentLoaded", () => {
      // Verificăm dacă există o echipă încărcată din Pagina de Arhivă
      const savedTeam = localStorage.getItem("selected_team_edit");
      
      if (savedTeam) {
        try {
          const teamData = JSON.parse(savedTeam);
          loadTeamForEditing(teamData);
          localStorage.removeItem("selected_team_edit"); // Curățăm stocarea temporară
        } catch (e) {
          console.error("Eroare încărcare echipă:", e);
          resetFormToNew();
        }
      } else {
        resetFormToNew();
      }
    });

    function resetFormToNew() {
      document.getElementById("ID_echipa").value = "";
      document.getElementById("Nume_echipa").value = "";
      document.getElementById("Activitate_preferata").value = "";
      document.getElementById("pageTitle").textContent = "Formare Echipă Nouă";
      
      // Resetăm lista cu 2 rânduri goale implicite
      membersList = [
        { id: "", nume: "", telefon: "" },
        { id: "", nume: "", telefon: "" }
      ];
      renderMembersTable();
    }

    function loadTeamForEditing(team) {
      document.getElementById("ID_echipa").value = team.ID_echipa || "";
      document.getElementById("Nume_echipa").value = team.Nume_echipa || "";
      document.getElementById("Activitate_preferata").value = team.Activitate_preferata || "";
      document.getElementById("pageTitle").textContent = "Completare / Editare " + (team.Nume_echipa || "Echipă");

      if (Array.isArray(team.Membri) && team.Membri.length > 0) {
        membersList = team.Membri.map(m => ({
          id: m.ID_zilier || "",
          nume: m.Nume_membru || "",
          telefon: m.Telefon || ""
        }));
      } else {
        membersList = [{ id: "", nume: "", telefon: "" }];
      }
      renderMembersTable();
    }

    function renderMembersTable() {
      const tbody = document.getElementById("membersTableBody");
      tbody.innerHTML = "";

      membersList.forEach((member, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="p-2">
            <input type="text" value="${member.nume}" oninput="updateMember(${index}, 'nume', this.value)" placeholder="Nume membru" required class="w-full h-9 px-2 border border-slate-300 rounded text-xs outline-none focus:border-amber-500">
          </td>
          <td class="p-2">
            <input type="tel" value="${member.telefon}" oninput="updateMember(${index}, 'telefon', this.value)" placeholder="07xxxxxxxx" required class="w-full h-9 px-2 border border-slate-300 rounded text-xs outline-none focus:border-amber-500">
          </td>
          <td class="p-2 text-center">
            <button type="button" onclick="removeMemberRow(${index})" class="text-red-500 hover:text-red-700 font-bold">✕</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateMember(index, field, value) {
      membersList[index][field] = value;
    }

    function addMemberRow() {
      membersList.push({ id: "", nume: "", telefon: "" });
      renderMembersTable();
    }

    function removeMemberRow(index) {
      if (membersList.length <= 1) return;
      membersList.splice(index, 1);
      renderMembersTable();
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const idEchipa = document.getElementById("ID_echipa").value;
      const numeEchipa = document.getElementById("Nume_echipa").value;
      const activitate = document.getElementById("Activitate_preferata").value;

      // Maparea pachetului pentru Webhook (Cu ID_zilier inclus în fundal)
      const payload = {
        ID_echipa: idEchipa, // Gol pentru echipă nouă, populat pentru echipă existentă
        Nume_echipa: numeEchipa,
        Activitate_preferata: activitate,
        Membri_propusi: membersList.map(m => ({
          ID_zilier: m.id, // Preluat transparent din fundal
          Nume_membru: m.nume,
          Telefon: m.telefon
        }))
      };

      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Se trimit invitațiile...";

      try {
        const res = await fetch(WEBHOOK_MAKE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert("Invitațiile au fost trimise cu succes!");
        } else {
          alert("Eroare la procesare pe server.");
        }
      } catch (err) {
        console.error(err);
        alert("Eroare de rețea.");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Trimite Invitații WhatsApp";
      }
    }
  </script>
</body>
</html>
