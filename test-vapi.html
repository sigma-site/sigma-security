<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Demo Asistent AI Edric Auto</title>
    
    <style>
        :root {
            --primary-blue: #1a1a8b;
            --sigma-yellow: #fff200;
            --light-gray: #f8f9fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--light-gray);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 20px 15px;
            border-bottom: 5px solid var(--sigma-yellow);
        }

        header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px 15px;
            text-align: center;
        }

        .demo-box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            max-width: 700px;
            width: 100%;
        }

        .demo-box h1 {
            font-size: 1.6rem;
            margin-top: 0;
        }

        .phone-info {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 25px;
        }

        .nobrea-phone {
            white-space: nowrap;
            font-weight: bold;
            color: var(--primary-blue);
        }

        .order-form {
            margin-top: 20px;
            padding-top: 25px;
            border-top: 2px dashed #ddd;
            text-align: left;
        }

        .order-form h3 {
            color: var(--primary-blue);
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.2rem;
        }

        .field-group {
            margin-bottom: 15px;
        }

        .field-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }

        .field-group input, 
        .field-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
        }

        .btn-submit {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            border: 2px solid var(--sigma-yellow);
            transition: 0.2s;
        }

        .btn-submit:hover {
            background: #111166;
            transform: scale(1.01);
        }

        /* ============================================ */
        /* PANOUL PIESEI - POZITIONAT LÂNGĂ CHAT       */
        /* ============================================ */

        .piesa-panel {
            position: fixed;
            right: 490px;          /* Lângă butonul chat (care e în dreapta) */
            bottom: 24px;
            width: 360px;
            height: 640px;
            max-height: calc(100vh - 48px);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
            display: none;          /* Ascuns inițial */
            flex-direction: column;
            overflow: hidden;
            z-index: 999998;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .piesa-panel.show {
            display: flex;          /* Afișat când primește date */
        }

        .piesa-header {
            background: var(--primary-blue);
            color: #fff;
            text-align: center;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .piesa-header span {
            flex: 1;
        }

        .close-panel {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 22px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-panel:hover {
            background: rgba(255,255,255,0.4);
        }

        .piesa-image {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: #fafafa;
            min-height: 200px;
        }

        .piesa-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .piesa-image .placeholder-text {
            color: #aaa;
            font-size: 14px;
        }

        .piesa-info {
            border-top: 1px solid #eee;
            padding: 14px 18px;
            background: #fff;
            flex-shrink: 0;
            line-height: 1.6;
            font-size: 14px;
        }

        .piesa-info .nume {
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-blue);
        }

        .piesa-info .cod {
            color: #666;
            font-size: 13px;
        }

        /* ============================================ */
        /* MOBIL - Panoul sub chat                      */
        /* ============================================ */

        @media (max-width: 768px) {
            header h2 { font-size: 1.2rem; }
            .demo-box { padding: 20px; }
            .demo-box h1 { font-size: 1.3rem; }

            .piesa-panel {
                position: fixed;
                left: 10px;
                right: 10px;
                bottom: 10px;
                top: auto;
                width: auto;
                height: 45vh;
                max-height: 45vh;
                border-radius: 12px;
                z-index: 1000000;
            }

            /* Când e deschis panoul, chat-ul rămâne vizibil dedesubt */
            .piesa-panel.show {
                display: flex;
            }
        }

        /* ============================================ */
        /* RESPONSIV PENTRU ECRANE MICI (sub 480px)    */
        /* ============================================ */

        @media (max-width: 480px) {
            .piesa-panel {
                height: 40vh;
                max-height: 40vh;
                bottom: 8px;
                left: 8px;
                right: 8px;
            }

            .piesa-info {
                font-size: 13px;
                padding: 10px 14px;
            }

            .piesa-info .nume {
                font-size: 14px;
            }
        }

    </style>
    
    <!-- Widget Vapi -->
    <script async="" src="https://unpkg.com/@vapi-ai/client-sdk-react/dist/embed/widget.umd.js" type="text/javascript"></script>
</head>

<body>
    <header>
        <h2>DEMO LIVE - ASISTENT DIGITAL EDRIC AUTO</h2>
    </header>

    <div class="container">
        <div class="demo-box">
            <h1>Asistent AI pentru identificare si rezervare piese auto</h1>
            
            <p class="phone-info">
                Conversatia se desfasoara exclusiv prin chat text sau telefonic la numarul
                <span class="nobrea-phone">+1 828 379 8248</span>
            </p>

            <div class="order-form">
                <h3>Lasa aici o cerere de cautare in magazie:</h3>
                
                <form action="https://formspree.io/f/mbdvnzoa" method="POST">
                    <div class="field-group">
                        <label>Nume si Prenume</label>
                        <input name="nume" placeholder="Numele dumneavoastra..." required="" type="text"/>
                    </div>
                    
                    <div class="field-group">
                        <label>Adresa de e-mail</label>
                        <input name="email" placeholder="nume@exemplu.com" required="" type="email"/>
                    </div>
                    
                    <div class="field-group">
                        <label>Cod OEM (de preferat) / Nume Piesa</label>
                        <input name="cod_oem_sau_piesa" placeholder="Ex: 03G130073G sau Injector 2.0 tdi..." required="" type="text"/>
                    </div>
                    
                    <button class="btn-submit" type="submit">Trimite Cererea</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- PANOU DETALII PIESA - DINAMIC                -->
    <!-- ============================================ -->

    <div class="piesa-panel" id="piesaPanel">
        <div class="piesa-header">
            <span>🔧 PIESA IDENTIFICATĂ</span>
            <button class="close-panel" id="closePiesaPanel">✕</button>
        </div>
        <div class="piesa-image" id="piesaImageContainer">
            <img id="piesaImagine" src="" alt="Piesa Auto" style="display:none;"/>
            <span class="placeholder-text" id="piesaPlaceholder">Așteptând date...</span>
        </div>
        <div class="piesa-info">
            <div class="nume" id="piesaNume">-</div>
            <div class="cod" id="piesaCod">Cod OEM: -</div>
        </div>
    </div>

    <!-- Widget Vapi -->
    <vapi-widget 
        accent-color="#1a1a8b" 
        assistant-id="970da2f1-89c8-438c-ac8c-30abfa04528e" 
        base-bg-color="#ffffff" 
        border-radius="large" 
        button-accent-color="#ffffff" 
        button-base-color="#1a1a8b" 
        chat-first-message="Bună ziua! Sint Alina de la Edric Auto dezmembrări. Cu ce piesă vă pot ajuta astăzi, aveti codul OEM ?" 
        chat-placeholder="Scrie aici mesajul..." 
        main-label="Asistent Edric Auto" 
        mode="chat" 
        position="bottom-right" 
        public-key="ab245358-61ea-4876-b767-8e4ad159627d" 
        size="compact"
        mobile-view="compact"
        theme="light" 
        voice-show-transcript="false">
    </vapi-widget>

    <script>
        // ============================================================
        // 1. REFERINȚE LA ELEMENTE
        // ============================================================

        const panel = document.getElementById('piesaPanel');
        const closeBtn = document.getElementById('closePiesaPanel');
        const img = document.getElementById('piesaImagine');
        const placeholder = document.getElementById('piesaPlaceholder');
        const numeEl = document.getElementById('piesaNume');
        const codEl = document.getElementById('piesaCod');

        // ============================================================
        // 2. FUNCȚIE DE ACTUALIZARE A PANOULUI
        // ============================================================

        function updatePanel(data) {
            console.log('📦 Actualizare panou:', data);

            // Extrage datele din mesaj
            const nume = data.nume_piesa || 'Piesă necunoscută';
            const cod = data.cod_oem || '-';
            const imageUrl = data.imagine || '';

            // Actualizează textul
            numeEl.textContent = nume;
            codEl.textContent = 'Cod OEM: ' + cod;

            // Actualizează imaginea
            if (imageUrl && imageUrl.length > 0) {
                img.src = imageUrl;
                img.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                img.style.display = 'none';
                placeholder.style.display = 'block';
                placeholder.textContent = '⚠️ Imagine indisponibilă';
            }

            // Deschide panoul
            panel.classList.add('show');
        }

        // ============================================================
        // 3. CONEXIUNE WEBSOCKET LA PIESOCKET
        // ============================================================

        const wsUrl = 'wss://free.blr2.piesocket.com/v3/1?api_key=btYZZEMKHsT8PqeddRjA0wjSsUcmdTtWpTaPcQib&notify_self=1';

        console.log('🔌 Conectare la PieSocket...');

        const socket = new WebSocket(wsUrl);

        socket.onopen = function() {
            console.log('✅ WebSocket conectat!');
        };

        socket.onmessage = function(event) {
            console.log('📨 Mesaj primit:', event.data);

            try {
                const raw = JSON.parse(event.data);
                // PieSocket pune datele în câmpul "message"
                const data = raw.message || raw;
                updatePanel(data);
            } catch (error) {
                console.error('❌ Eroare la procesare mesaj:', error);
            }
        };

        socket.onerror = function(error) {
            console.error('❌ Eroare WebSocket:', error);
        };

        socket.onclose = function() {
            console.log('🔌 WebSocket deconectat');
        };

        // ============================================================
        // 4. BUTON DE ÎNCHIDERE
        // ============================================================

        closeBtn.addEventListener('click', function() {
            panel.classList.remove('show');
        });

        // ============================================================
        // 5. DETECTARE DESCHIDERE CHAT (PENTRU A POZIȚIONA PANOUL)
        // ============================================================

        // Ascultăm evenimentele widget-ului
        document.addEventListener('click', function(e) {
            if (e.target.closest('vapi-widget')) {
                // Chat-ul a fost deschis - dacă panoul are date, rămâne vizibil
                // Dacă nu are date, nu face nimic
            }
        });

        // ============================================================
        // 6. FORCE FIX PENTRU MOBIL - SCALARE IFRAME
        // ============================================================

        function forceMobileVapiScale() {
            if (window.innerWidth <= 768) {
                const observer = new MutationObserver(() => {
                    const widget = document.querySelector('vapi-widget');
                    if (widget && widget.shadowRoot) {
                        const iframe = widget.shadowRoot.querySelector('iframe');
                        if (iframe) {
                            iframe.style.setProperty('width', '100vw', 'important');
                            iframe.style.setProperty('height', '100vh', 'important');
                            iframe.style.setProperty('max-width', '100vw', 'important');
                            iframe.style.setProperty('max-height', '100vh', 'important');
                            iframe.style.setProperty('position', 'fixed', 'important');
                            iframe.style.setProperty('top', '0px', 'important');
                            iframe.style.setProperty('left', '0px', 'important');
                        }
                    }
                });
                observer.observe(document.body, { childList: true, subtree: true });
            }
        }

        window.addEventListener('DOMContentLoaded', forceMobileVapiScale);
        window.addEventListener('resize', forceMobileVapiScale);

        console.log('🚀 Pagina pregătită!');
    </script>
</body>
</html>
