
<!DOCTYPE html>
<html lang="ro">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Chat STRICTZILIER</title>

<style>

body {
    margin: 0;
    padding: 30px;
    background: #f5f7f5;
    font-family: Arial, Helvetica, sans-serif;
}

.box {
    max-width: 600px;
    margin: 0 auto;
    padding: 25px;
    background: #173b3a;
    color: white;
    border-radius: 16px;
}

h1 {
    margin-top: 0;
    font-size: 22px;
}

textarea {
    width: 100%;
    min-height: 100px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    resize: vertical;
    font: inherit;
}

button {
    margin-top: 12px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #d9873d;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255,255,255,.08);
    border-radius: 8px;
    white-space: pre-wrap;
    min-height: 40px;
}

</style>

</head>

<body>

<div class="box">

    <h1>TEST CHAT STRICTZILIER</h1>

    <textarea
        id="message"
        placeholder="Scrieți mesajul aici..."></textarea>

    <button id="send">
        TRIMITE
    </button>

    <div id="result"></div>

</div>


<script>

const messageInput =
    document.getElementById("message");

const sendButton =
    document.getElementById("send");

const result =
    document.getElementById("result");


let previousChatId = null;


sendButton.addEventListener(
    "click",
    async function() {

        const message =
            messageInput.value.trim();


        if (!message) {
            return;
        }


        result.textContent =
            "Se contactează agentul...";


        sendButton.disabled = true;


        try {

            const response =
                await fetch(
                    "https://2.pie.host/chat.php",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message: message,

                            previousChatId:
                                previousChatId

                        })

                    }
                );


            const data =
                await response.json();


            console.log(
                "Răspuns server:",
                data
            );


            if (!response.ok) {

                result.textContent =
                    "EROARE:\n" +
                    JSON.stringify(
                        data,
                        null,
                        2
                    );

                return;
            }


            result.textContent =
                data.reply ||
                "Agentul nu a returnat un răspuns.";


            if (data.chatId) {

                previousChatId =
                    data.chatId;

            }


            messageInput.value = "";


        }

        catch(error) {

            console.error(error);

            result.textContent =
                "Eroare de conectare:\n" +
                error.message;

        }

        finally {

            sendButton.disabled =
                false;

        }

    }
);

</script>

</body>
</html>
